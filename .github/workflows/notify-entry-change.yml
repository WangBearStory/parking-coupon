name: 입차시간 자동 변경 + 쿠폰 적용

on:
  schedule:
    # cron 03:30 UTC(=12:30 KST). GitHub 스케줄 지연 ~4h 감안, 실제 14:30~17:00 KST 창 목표
    - cron: '30 3 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/notify-entry-change.js
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
