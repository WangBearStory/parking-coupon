name: 입차시간 자동 변경 + 쿠폰 적용

on:
  schedule:
    # cron 03:10 UTC(=12:10 KST). GitHub 스케줄 지연이 근래 ~4h+라 20분 더 앞당김, 실제 ~16시 KST 목표
    - cron: '10 3 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/notify-entry-change.js
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
